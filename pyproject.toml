[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motrisk"
version = "0.1.0"
description = "Estimating the probability of each defect at a vehicle's next annual roadworthiness test, and what checking the likeliest first saves a fleet manager, from Great Britain's anonymised MOT records."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Davide Bason", email = "davidebason@gmail.com" }]
dependencies = [
    # Logs in to Azure: through `az login` on a workstation, through a managed identity in Azure.
    "azure-identity>=1.27",
    "azure-storage-blob>=12.20",
    # Reads the file links on DVSA's portal page, the only listing of the 2024 and 2025 extracts.
    "beautifulsoup4>=4.15",
    "duckdb>=1.1",
    # Teaches zipfile to read the Deflate64 members of the 2022 and 2023 results archives. It
    # ships no wheel for Python 3.12, so pip compiles it: a C compiler and Python's headers needed.
    "zipfile-deflate64>=0.2",
    "pandas>=2.2",
    # Hands DuckDB's list columns to numpy as offsets and values, for the full models' inputs.
    "pyarrow>=17",
    # Imported directly by the fetcher, so declared here even though azure-core also installs it.
    "requests>=2.34",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    # Writes the Deflate64 archives the tests read, which zipfile cannot write.
    "inflate64>=1.0",
    "pytest>=8.0",
    "ruff>=0.5",
]
# The dbt build under transform/. Kept out of dependencies because no module under src/ imports
# dbt: it is run from the command line. Pinned, so that a build is reproducible.
# Install with `pip install -e ".[transform]"`.
transform = [
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.1",
]
# Making pictures, and exploring which picture to make. Install with `pip install -e ".[figures]"`.
figures = [
    "matplotlib>=3.9",
    "jupyter>=1.1",
    # Strips notebook outputs on commit, so a diff shows code rather than rendered images.
    "nbstripout>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
